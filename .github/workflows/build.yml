name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: gradle :app:assembleRelease --no-daemon
      # Signing: the private key comes from the repository secrets SIGNING_KEYSTORE (base64) and SIGNING_PASSWORD.
      # The old key (app/release.keystore, public) signs only the proof of rotation, so installed copies update in place
      # (Android 9+); it can no longer sign an update on its own.
      - name: Sign
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          OLD="--ks app/release.keystore --ks-pass pass:prayertv123 --ks-key-alias prayertv"
          if [ -n "$SIGNING_KEYSTORE" ]; then
            echo "$SIGNING_KEYSTORE" | base64 -d > new.jks
            NEW="--ks new.jks --ks-pass env:SIGNING_PASSWORD --ks-key-alias prayertv"
            "$BT/apksigner" rotate --out lineage.bin --old-signer $OLD --new-signer $NEW
            "$BT/apksigner" sign $OLD --next-signer $NEW --lineage lineage.bin --rotation-min-sdk-version 28 --out prayer-tv.apk aligned.apk
            rm -f new.jks
          else
            echo "::warning::The SIGNING_KEYSTORE secret is not set: signed with the old public key only"
            "$BT/apksigner" sign $OLD --out prayer-tv.apk aligned.apk
          fi
          "$BT/apksigner" verify --verbose --print-certs prayer-tv.apk | grep -E "Verified using|Signer|certificate SHA-256" | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: prayer-tv
          path: prayer-tv.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: نسخة ${{ github.run_number }}
          files: prayer-tv.apk
          make_latest: true
