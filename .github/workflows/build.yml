name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: gradle :app:assembleRelease --no-daemon
      # Signed with app/release.keystore (kept in the repository so every build updates the installed app in place)
      - name: Sign
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks app/release.keystore --ks-pass pass:prayertv123 --ks-key-alias prayertv --out prayer-tv.apk aligned.apk
          "$BT/apksigner" verify prayer-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: prayer-tv
          path: prayer-tv.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: نسخة ${{ github.run_number }}
          files: prayer-tv.apk
          make_latest: true
